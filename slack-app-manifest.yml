display_information:
  name: Slackort
  description: Slack-native support ticketing -- FAQ canvas, one-click resolve, daily summaries, helper leaderboard.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: slackort
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /ticket
      description: Open a new support ticket
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - reactions:write
      - reactions:read
      - usergroups:read
      - channels:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
