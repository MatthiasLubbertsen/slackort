display_information:
  name: Hestia
  description: Slack-native support ticketing for many channels at once -- FAQ links, one-click resolve, daily summaries, helper leaderboards, all managed from the Home tab.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: hestia
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:write
      - reactions:read
      - usergroups:read
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
